body:
  text: 王氏談録雜家類三雜説之屬提要臣等謹案王氏談録一卷不著撰人名氏説郛載之題曰王洙撰書録解題則以為翰林學士南京王洙之子録其父所言今觀此書凡九十九則而稱先公及公者七十餘則則非洙所著明甚葢編此書者見卷尾有編録觀覽書目一則末題云王洙敬録遂以為全書皆出洙手不知此一則乃嘉祐以前人所為洙特録而跋之其子附載書末耳世無自著書而自標敬録者也其解繪事後素一條朱子集注取之其論校書當兩存解經不可改字就義皆為有識其稱校書之注二字以上謂之一云一字謂之一作亦深有理洙字原叔應天宋城人中甲科官終侍讀學士兼侍講學士卒諡曰文子欽臣字仲至賜進士及第官終待制知成徳軍據本傳及東都事畧洙子惟欽臣一人則此書即欽臣所録也乾隆四十六年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書王氏談録訓子公誨諸子曰忠非必殺身自盡其誠也可今人莅一官茍能竭力於大小之務不自愧於禄食推而廣之至於大事皆忠也至於以身死事盖古人不幸而遇之耳閨門之内承順父母顔色為先吾先公中令奉戚氏太夫人極為子之道太夫人每有小不如意未嘗與先公一言先公必朝服再拜候其色悦而退先公在金陵餘杭清夜多作詩必召吾起草或屬數句未成且假寐吾持筆侍側往往至中夜不敢退時吾十五六歳未始知倦今吾愛汝曹不欲以嚴限慈世事當自勉也爾雅公言爾雅文選待文士之秘學也使人知之必譏其所習淺未至規橅裁取不習或闕嘗戲曰韓愈詩多用訓故而反曰爾雅註蟲魚定非磊落人此人滅迹也𨽻書公素不習𨽻書初但微作八分皇祐中受詔書獻穆公主碑李氏求以古𨽻冩於是始作𨽻書既出人競愛宋丞相曰近世人家栢楹之刻所未及也君謨亦云君之𨽻字乃得漢世舊法僕之所作但唐謂一本作體𨽻耳筆法公言用筆須圓勁結體須作方正然後以奇古為工皇祐中受詔與君謨分寫邇英閣二圖公書無逸篇君謨真字書孝經既成上作飛白二軸答之後又受詔分寫集禧觀諸殿榜公書奉福虚福殿二榜君謨書神藻殿二榜為文公誨諸子屬文曰為文以造語為工當意深而語簡取則於六經莊騷司馬遷揚雄之流皆以此也又論修身行道至於性命之理既而曰此皆第一等語汝輩一詞賦亦未能善固未知也然不當不為汝輩道讀書記公嘗言隋王劭作讀書記凡所説書隨意所取疏之後輯而成篇又唐人有臺閣集纂當世名人詩今此二書人家罕有存者鷄鳴歌公言人嘗云汝南出鳴鷄考之舊事漢時於汝南取能鷄鳴歌之人其云鳴鷄盖謬也葬公言昔觀孔子墓視其地之形勢大與今俗深相符今之術果昔人之所遺耶子房封留公言今陳留立祠祀張子房非也所封留沛今彭城有留城是也昔宋武北征過陳留下教修復其失盖已久矣作文公訓諸子曰壯年為文當以氣焰為上悲哀憔悴之詞慎不得法知字音切公言學者不可不知音切茍不通終為不識字人論隂陽拘忌公言昔有一士人病其家數世未葬亟出錢買地一方稍近爽塏者自祖考及緦麻小功之親悉以昭穆之次葬之都無嵗月日時隂陽忌諱與塋穴之法人且譏其易而謂禍福未可知歲中輙遷官秩後其家益盛以此觀之真達者也今之人稽留葬禮動且踰紀邀求不信之福於祖先遺骸真罪人也筆法江南李主及二徐傳二王撥鐙筆法中朝士人吳遵義待詔尹希古悉得之吳尤以為秘所傳二人與范宗傑而已其法五字擫厭抵勾揭吳又云更有二字曰蹲送蹲送者蹲鋒迎送之謂耳若作一字必從腕勢中出之吳笑曰然讀甘露記公嘗讀甘露記歎曰無妄之禍乃至於此以此視之軒冕非可戀之物吾日有歸意唐時金帶公言李防給事有一金帶唐之制作撻尾刻云龍朔某年紫宸殿宣賜鄭畋其制作與色澤尤奇防卒其子不肖妄以與人臨淄公晏殊留守南郡大㑹客伎有服金帶立其側者公目之覺異於常引視其刻問所従來曰李氏子所假公俛歎久之京氏律厯京氏律厯一卷虞翻為之解其書雖存學者罕究公従秘府傳其書究習遂通屢以占卦甚效修書進藁公言修書藁草隋書尤重謂之初藁每與正本並奏古事不見所出公言古事有相承傳用而不見出者甚多如顔回讀書鐵鏑三摧是其一也秘閣易法公言秘閣有鄭氏注易一卷文言自為篇而陸氏太𤣥篇第亦各異考之足以見古易經之舊次方藥精通公言髙文莊方藥精通聚奇藥價及巨萬雅尚之一也繪事後素公言繪事後素即考工記所謂後素工也七言詩公言古七言詩自漢末盖出於史篇之體性貴平淡公言人性貴乎平淡若加以器識即所謂宰輔器也盖宰制方物等之公平甄别不差足任機柄耳昔劉劭論人物亦以平淡為先也蘭蕙公言蘭蕙二草今人盖無識者或云雚香為蕙草録書須黏葉公言作書冊黏葉為上雖歲久脱爛茍不逸去尋其葉第足可抄録次序初得董子繁露數卷錯亂顛倒伏讀歲餘尋繹綴次方稍完服乃縫綴之弊也嘗與宋宣獻談之公悉命其家所録書作黏法少女風公言管輅云天欲雨樹上已有少女風今俗多云急風翻葉見白者是靈符石公少遊蜀於江濱得靈符石石理堅潤其文尤異李廷珪墨公性尤愛墨持玩不厭几案牀枕間往往置之常以柔軟物磨拭發其光色至用衣袖畧無所惜慶厯中人有持廷珪墨十九求售従子參預託公草文字恐溷其思遽令麾去公後聞之極為歎惜後此墨尤難得而屢以萬錢市一丸其品乃有數等其邽字作下邽之邽者為上作圭潔之圭者次之作珪璧之珪者又次之其云奚庭圭者最下盖廷珪本燕人奚初姓後徙江南其初未奇久而益佳故李主寵其能賜之姓也雖名號有髙下其間又自有粗精亦時有偽作者人亦多惑公言若辨之當視其背印云歙州李廷珪墨歙旁州字之左足與李字之中書可與子字之足貫又與廷字之豎書墨字之右角貫視之上下相通者為真公又自能造墨在濠梁彭門常走人取兖州善煤手自和揉妙為形體盖光色與廷珪相上下既成分遺好事悉伏其精嘗以廷珪墨遺君謨隴西王之子恂謂公曰聞以墨遺君謨槖中必缺請以一丸補之小篆奇古公亦習古文小篆嘗謂古文至少至許慎所不載及不出孔氏書者悉後人所造學之少所根據小篆源流可究便於施用公用筆奇古慶厯中士大夫家墓銘盖多公筆也今上景祐徽號玉冊宣獻宋公受詔寫宋公不習篆公與代書也又章郇公受詔書相國寶奎殿太宗真宗詩額亦公代之篆銘嘉量皇祐中上令少府作嘉量公稽攷制度參以周漢既成自篆刻銘奏御藏於内府詔在集中碑額按公所書古𨽻字則獻穆公大長公主碑曹襄悼碑范文正碑晏元獻碑伊先生隔山庵記正字則張少監墓誌濠州四望亭詩莊生臺詩宋宣獻詩書額濠州四望亭南京御史臺讀易堂襄州峴山亭臨芳亭華嚴寺羊太傅廟西京教忠積慶寺東都李氏閒燕堂來鶴堂連亭箖箊亭劉氏芸華堂古器景祐中内出古銅鐘鼎尊三器詔公辨其欵識公驗其文稱有周立王字法參以篆𨽻形制不與經典相合非逺古時物疑似武氏時器具上其事詔藏於龍圖閣語在公集中皇祐中又出玉器二一為四龍行走上騰之形其端升餘可置物一為梳形旁上連窣綿繰可插羽下有柄雕以蜻蜓蝘蜓絶工巧公以為皆物柄也梳形者疑古人羽扇之柄其他莫可知辨藥公示京師市藥須當精别市中藁本多雜以威靈仙不可稱辨往往誤售入藥遂不為效藁本盖柔細而芳香者是自治之要公謂諸子曰人之文章美者固譽之不至者未嘗輕視吾心意和平得自治之要險巇貪媢固自不生怨尤僥倖逾絶思慮以其染汚吾心戕賊天理皆屏之於未萌然事有曲直必當中理今朝廷之士與吾論事有不直謗毁甚多然吾皆不責固無報復盖吾自信者篤耳此乃汝輩粗識善惡人亦不能欺吾其能以無為有紿汝輩耶吾既已自力如此更欲汝輩效而為之不可不勉也校書公言校書之例它本有語異而意通者不可取信盖不可决謂非昔人之意俱當存之但注為一云一作二字已上謂之一云一字謂之一作公自校杜甫詩有草閣臨無地之句它本又為荒蕪之蕪既兩存之它日有人曰為無字以為無義公笑曰文選云飛閣下臨於無地豈為無義乎唐鄭顥自云夢為詩十許詔有云石門霜露白玉殿蕪苔青意甚惡之後遇宣宗山陵成因復職公嘗笑曰此杜工部橋陵詩也顥以為真陵之祥而更復綴緝亦嗤鄙之一也相知之厚蔡文忠守南都公時為書院説書且將薦公而謂公曰欲薦而未有人可令草奏以叙君之美莫若煩君自為之公謝曰某之才不足當公薦今石太祝延年衆愛重宜置某而薦石蔡公曰石固欲薦之亦當自令草奏公徐曰得之矣遂命公草石奏而石為公草奏初罷野城尉里中是時晏丞相為留守方修後圃而使諸曹掾賦馴鶴小池戸曹掾玉初邀同賦既成并上臨淄公公喜遇之甚厚及臨淄公還朝力薦為應天府學講書語在公家傳中是後蔡文忠繼守留鑰復待以上客蔡公既去而宋公來其所以遇之尤加每公事退開郡閤邀公殆日以為常相對但持書冊論議而已宋公嗜食乾果羅列左右間或相勸食或以文章示公句意有所欲易及一字不安者必曰君試思之公曰以某句某字如何曰更試思之或至再三遂用後宋公還朝公亦入上庠又陪佐史局無一日異於初宋公薨公為之議諡撰著行狀象篆勒墓銘諸宋以服帶緡錢遺於公甚厚公不發其封悉還之李邯鄲公戲簡公曰可惜筆端得來盡被車兒推去後老思宋公平昔之知嘗歎曰相知之厚不愧古人今亡矣夫去年公謁告還里中錢于飛侍讀為留守其妻宋公女也聞錢宴公于郡齋曰是往者日與吾父論書於此齋中吾家為肴羞尊酒以待者也因泣下明日錢以其妻語語公公亦為悽然古今樂律通譜公洞曉音律自能辨聲度曲嘗究今樂之與古樂所由變而總諸器之同歸以籍於譜至如言黄鐘其聲則屬絃之某抑按金石之某聲考筦之某穴皆衡貫為表而别之至於北部諸器亦然雖不知者可一視而究號曰古今樂律通譜又云今北部樂乃古之清商遺音其論甚詳芸芸香草也舊説為不食今人皆不識文丞相自秦亭得其種分遺公嵗種之公家庭砌下有草如苜蓿揉之尤香公曰此乃牛芸爾雅所謂權黄華者校之尤烈於芸食與否皆未可試也李衛公文公亟稱李衛公之文謂不減燕許每讀積薪賦曰雖後來之髙處必居上而先焚真文章之精致也作文立意班固典引序唐堯君臣之德迭享天下云股肱既周後授漢劉公言古人作文立意髙奇如此後學者可不務哉一云文當務立意髙奇不蹈陳故為箴自警公始為進士居里中與嵇穎缺竇充締交合各為箴以自警期待之深公為舒城尉馬亮鎮廬江始入謁謂公曰君狀貌類宋尚書白材質正與君等他日亦不下此人後入上庠暇日謁邢侍讀昺識公甚喜歎曰君異時之孫馮也孫奭馮元方貴顯上官忌兀日公云隂陽忌諱固不足泥然亦有不可畧者嘗記丁顧言少卿云昔遊宦蜀中至官有期駐舟江滸游憩山寺遇老僧問丁公何為而至丁具以之官告又問期在何時丁又以告僧曰是所謂兀日不可視事弗避之君必以事去君笑而不應既至官月餘竟以事免歸丁深異之於是復道故處従僧謁其術丁屢以語公臨治頗用之水漬書冊公言藏書之家書冊或為雨漏及途路水潦所漬者皆可大甑中蒸而暴之至一二畨乃以物鎮壓平處逮乾色雖微漬而畧無損壞雌黄墨公言雌黄為墨校書甚良飛研極細堅膠揉為錠無油甆器中磨加以少藤黄尤佳詩話公言舊嘗得句云槐杪青蟲縋夕陽因思昔人似未曽道後閲杜少陵詩有云青蟲懸就日尤歎其才思無所不周也契丹風物公言昔使契丹戎主觴客悉以玉杯其精妙殆未嘗見也又言北人饋客以乳粥亦北荒之珍彼中有鐵脚草採取隂乾投之沸湯中頃之莖葉舒卷如生書儀公言唐裴鄭二家書儀皆云凶書須好紙繕寫言語哀雅稽之似非寧戚之義不若以生紙書之語言字體質朴為稱元父城公言阮籍有元父城賦甚陋其土昔嘗經行視其地信然方言揚雄方言世所傳云舊本也公患其無次序判别其訓各以類従且云此殆子雲之初意也後人見其有條理便謂昔本則妄耳修書按公所修之書春秋蕃露舊墜簡脱文差互不可考公數年尋繹文義綴緝始成仍舊為十卷方言舊無次序公析之以類従杜甫詩古六十卷今亡世傳二十卷止數百篇參合别本以嵗時為類得編二十卷髙適詩舊十三卷公分為十卷易緯館閣舊本以乾鑿度稽覽圖通卦驗分為三書各自著分擾隋唐志目並載易緯九卷仍依篇次合為一書復其舊次詩話公言近人别傳杜甫詩杜鵑行一篇云誰言養雛不自哺此語亦足為愚蒙此正破前篇非甫作也醫公言昔東都有一醫者姓劉其術甚異通黄帝八十一難經病註者失其㫖乃自為解獻于闕下仍為人講説自號曰劉難經其治疾察脈無隠不知肘後有二藥奩止藥末數品而已每視人病旋取諸末合和加減分為劑料日服不盡其數病未愈他日再至曰此藥服不如數耳所餘當有幾人不能欺後以老終論逸少書公言每閲王右軍書覺每帖氣勢各異此所謂羲之萬紙不同也醫茶公言茶品髙而年多者必稍陳遇有茶處春初取新芽輕炙雜而烹之氣味自復在襄陽試作甚佳嘗語君謨亦以為然古碑石舍人楊休典宿州蘄澤岸傍得古碑刻云有周渤海公𤣥孫伯著之碑問公所謂公者非宇文氏乎公曰然史官宋丞相庠與翰林祁公皆布衣之舊同年登科皆貴達益篤契好初宣獻公薦公入史局時邯鄲李公叔領撰著李方貴顯與宋公同列而不相下頗有間隙宋既與公舊勸公毋受命公辭以辱宣獻公知不敢避讓宋怒遽折簡謂公曰自古為史者不免天菑或人禍子何為當而不避今且賀子而弔子也藥性公言醫藥治病或以意類取至如百合治百合病似取其名嘔血用胭脂紅花似取其色淋漓腸結則以燈心木通似反其類意類相假變化感通不可不知其㫖也唐三宗像公言舒城縣民李氏者唐宗室之裔有一軸畫上畫𤣥肅代三帝真云其先别子所出也其畫亦當時之跡每持以見縣官免科役王建宫詞王建宫詞云如今池底休鋪錦公言此即文公對李公石云開元中舊宫人盡在問之無知此事者楊姓異同楊修書云修家子雲公言子雲自叙為楊侯之裔自為楊字恐與華陽之陽異唐世詩僧公言唐世詩僧得名者衆然格律一體乏於髙逺顔延之所謂委巷中歌謠耳唯皎然特優解經公言學者解經或有改字就義者非先儒闕疑之旨往往自取議起居注公言穆天子傳左右史之書起居注始於漢世乃有遺法也故今崇文書目以穆傳首記注之列黄白術公言先中令在金陵有一術者自言得黄白術請試之初持二藥罨至云丹砂所化也中令不以為然既而請持歸明日復至皆先所見物也而其一當中印一指痕乃金瀝也其一如滿盛其瀝而復瀉去者其表則素潔如初遂留二物而去後不知所適又公言初赴舉時接一士人稍親近忽謂公曰君苦無資乎求開通錢千餘當為君化少物公曰錢固有而難化也既得開通曰銅精者皆可數日持銀十兩至視之錢周郭與字隠隠尚在謂公曰君并欲其法乎亦無所秘公笑曰聊試卿法爾吾無所用悉還之後月餘其人卒丁謂家資公言丁謂前敗之一夕買竭都市中金餘産籍没後官斥賣人有買其綵薦一拆之得絹凡三百餘端二蘇草𨽻二蘇皆工草𨽻而舜欽先得名人或咨公云二人優劣公曰才翁筆勢勁媚疑較長也周官公言學者多云疑周官初以吾考之殆作而未用之書也以近事比之唐世制六典著當時百官之目最為詳悉竟不能遵用晏相觀書公言晏丞相自云觀書遇事有可用者必準度所宜使處然後黙記如未獲用者心常恨之他日臨文速不廢忘贈日本僧詩公言祥符中日本僧寂照來朝後求禮天台山先中令守㑹稽寂照經由來謁寂照善書迹習二王而不習華言但以筆禮通意時長兄為天台宰中令以書導之兼贈詩云滄波泛瓶錫幾月到天朝鄉信日邊斷歸程海面遙秋泉吟裡落霜葉定中飄為愛華風住扶桑夢自消既至天台來致書謝累幅勤至其字體婉美可愛楊文公在禁中識之亦嘗序其事夢公言始作禮官時夢入禁苑中引一紫衣人至後亭見上免後踰年荆王薨皇帝受服予時引太常卿入苑中其徑路所至皆夢中所見汗衫公言皇祐中人有獻唐昭宗御服汗衫一上有朱字手詔與錢鏐求助兵時隔塞不通盖密信也獻者朱氏子孫欲求官朝廷留而賜之帛遣之厯官公言近世司天算楚衍為首既老昬有弟子賈憲朱吉著名憲今為左班殿直吉𨽻太史憲運算亦妙有書傳於世而吉駮憲棄去餘分於法未盡贈狄國寅詩耀州三闕人狄國寅自云仁傑之後有告身數通及代宗時御史中丞狄歸昌請復御膳表具攜以示公仍請詩云每讀梁公傳青編日屢開神交慕英烈自喜見雲來一命須朝禄連章薦楚材凡昇黄綬秩世代乃身媒國寅向以龍圖閣直學士狄棐論得官詩話公言杜甫為詩多用當時事所言玉魚蒙塟地者事見韋述兩京記云云有言鐵馬汗常趨者昭陵陵馬助戰是也此類甚多此篇不全評書公雅好永禪師書嘗得古本千字文手自裭背暇則玩閲至老不倦嘗云今人筆美未能為書須結體巧常使左方髙氣勢自得遒媚乃為佳也與蔡君謨在西閣朝夕評書君謨每有繕寫求公指其失後語公曰與原叔論書數年自覺倍精昔時人或與公論禪理公曰仲尼絶四毋意毋必毋固毋我盖不出是也自强叔彛云富公才業賢望如此然其心好學喜為文章又樂與人論議經㫖及古今興亡治亂雖逐日亦各有工課夜坐一書室中或至二三更方歸寢此盖往年曽倅鄆州佐王曽相而曽乃如此所為富公亦常服其勉勵耳此實士君子規矩其身而不敢自懈易曰君子以自强不息此之謂也通經叔彛常云士有曉熟世務兼能作文字者然後能通經又其常心於其間故也然則如今天下學者皆能經術然求所謂通經者其人少矣修慎韓謙父聞臺官吳中復等疏陳相執中所為及家私事凡九條謙父乃曰此言必書之史傳施後世而不善之名安可掩哉士君子豈得不修慎哉訪問倪義父云某每因往街市或坐次逢河東河北陜西客旅等某必問其事意亦要知茶鹽礬之類及雜物有所更改増添條制之事又可以知省中所行事宜經久便與不便如何也識明則經明周伯堅云某於周易與先生之説有不同之處然則君子所患者識耳識明則經明而周流通變矣不置侍婢伯堅又云相愛者與家人言以某年髙在逺方勸置一女子侍飲食湯藥圖其安逸某乃云自幼年力耕鑿孤貧讀書歴盡艱苦而執志期於粗有所樹立而今幸亦為人所見愛茍或如此是棄忘其初心也作文主之以誠管允中云凡修學不患作文字不能精在持身立事自期如何耳然則作文字必主之以誠也中庸曰不誠無物誠之説於聖賢道可謂至大矣政事蔡監簿至夫在學云叔彛有書與叔父密學言京師弊政十餘條而叔父已先行其七八與叔彛所聞者暗相合叔父甚喜之時君謨行京兆事思慮潘十六十九秀才在富相為外甥云舅氏往年典郡某嘗於左右修學而舅氏每中夜或獨坐一靜書室中至二三更但仰靠椅子不知思慮天下何事也好學歐大太祝云大人嘗云太師致仕在家每日須看文字又喜學書并草書又歐大又云大人在家逐日須作文字而於經史間亦各有工課耳廉慎焦秀才云胡内翰於湖州時買物却於他郡致仍一一供税錢也相人歐大又云凡相人最好於得失榮辱之際觀其動否便可知其器之小大也然後見其人之前程也作官又云作官須事事要知只如耕犂之具亦要知制作盖臨政利民亦有使處又云作官須且坐而觀之久而後可發作官不在文章劉參政作官後不在文章亦不全在器業也持身焦秀才云錢志通于編勅刑統皆一一節目之又云不患作文字不精患不能持身與立事耳又云君子不以己所藏而推所受河圖歐公云河圖之説雖見於書易論語禮記某獨以為不然盖後之人好怪説耳豈有聖人以己有德而不獲天位非也某以文字正之後世必有信之者一千年後必得一人信之二千年後又必得一人信之又三千年後又必得一人信之矣以三千年而獲三人見信則後數千年信者必多則其説行矣作詩又云凡作詩并選中唐之名士衆作格式每作三五篇雜於其間文字亦然推誠待物相業附李兵部云唯人推誠待物不要城府而人自和平也某凡于職司十餘年前後應猜防人底文字並不發奏及其闕某奏此事乃先奏某亦依違闕供闕亦不欲旁損其人也又云嘗見龎相勸其如公孫𢎞之脱粟飯布被伊不聽其言豈有六十五嵗更造宅營葺所活幾時其愚可知己又云凡宰相多以己之親戚遂隔朝廷仕宦者豈至公之道邪賈相則不然雖唐詢為事令作臺官亦不言之又云夫易之咸卦聖人感人心而天下和平此事亦甚大以一人之心感天下使之和平豈非誠乎非以虛受人而人可化哉盖虛受人則無城府無城府則無疑無疑則誠矣又云今之居宰相百執之上不慮人之窺伺而錯作事天下人之聰明豈可掩哉又曰凡在中書者自平生讀書學聖人之道及可用之處反不用之其本為利禄所汨而聰明有所蔽也又云今之大臣但家中為歡樂豈有思天下憂患與國家之安危平生所學當行之事哉賢者能受毁大臣欲知典故附張中行云夫賢者難能受屈辱盖以其有所負而期於後世也夫譽者人易受而毁者所不能堪然而能堪受人之毁而不動者亦唯賢者能之夫平居無事之時人皆能言可以守道死而不變及有罹患難而當鼎鑊之誅而獨能不易其操者乃為難耳又云大臣者欲知國家故事如魏相者則可以為宰相而治天下者也作文歐公某云每日雖無别文字可作亦須尋討題目作一二篇又曰凡看史書須作方畧抄記又曰文字既馳騁亦要簡重經史焦秀才云欲作文字與立身先且須積日以養其源可也長源與知仲書曰知日講史記及孟子甚善甚善盖經書養人根本史書開人才思此事不可一日廢而須自少年積之宜常用此法也附編録觀覽書目焦思慮聞見可記事寫三朝寶録尋諸司事例文字抄記本朝各臣所施為事節尋求河北河東陜西東西川廣古今戰鬬行師方畧編録河北至廣南六處極邊山川地圖編録古今凡興利公私事求録古今治水方畧地圖等尋訪應語系文字編録三司錢穀文字究問國家每年二嵗科數與一年京師官吏三軍諸軍請受并内外諸雜支用多少科有蓄積豐乏之數訪問兵籍禁軍廂兵内外實増減數多少之數編録應律令刑統文書訪問内外養馬數多少并編録古今養馬買馬法編録水陸舟車轉運方畧編録兵家文字編録應械形制法度編録四方今有遺利于民事編録歴代帝王所尚有益於國家事編録歴代名臣為政畧事尋訪闕樂文字編録歴代至唐五代國朝以來貨殖所營為事編録國朝諸將臨敵制置方畧事編録國朝宰相所施為事編録自來行文書中利害事節編録諸官所藏家書目録編録諸在官所為方畧宰相三司御史臺開封府糾察在官刑獄羣牧司樞密諫官大理寺流内銓審刑院安撫益州北使審官院縁邊轉運提刑臺閣故事觀三朝寶録共三百八十卷内太祖五十卷太宗八十卷真宗一百五十卷孫奭宋綬陳堯佐等同修撰觀三朝聖政畧十四卷三朝聖政畧石介三朝寶録三十卷王曽三朝寶訓十卷吕夷簡國朝㑹要一百五十卷慶厯二年張得朝太宗故事二十卷富弼觀文鑒古圖慶厯四年三朝訓鑒圖十卷皇祐李淑皇祐方域圖五十卷王洙掌禹錫兩朝寶訓三十卷林希熙豐聖訓二十卷林虞仁宗政要四十卷張唐邇英延英二閣記注三卷賈昌朝寶文天人祥異書十卷三十門章得象聖政記一百五十卷丁謂政録節要十二卷聖範一卷英祖記畧一卷正統十卷英宗神武秘畧十卷仁宗太常因革禮三百卷姚闢韓洵歐陽修李東之鹵簿圖記十卷宋綬紀年通譜十卷文彦博宋庠髙若訥州縣祭社稷儀一卷祥符禮官閣門儀制六卷梁顯元豐郊廟奉祀禮文三十卷編年通載十卷章衡朝制要覽備對六卷畢仲衍開寶通禮義一百卷盧多遜禮書一百五十卷陳用之樂書陳晉之大樂圖二卷宋郊諡法蘇洵先天記降聖記封禪記五十二卷大中祥符祀汾隂記五十二卷迎奉聖像記續通典一百卷宋白唐㑹要一百卷王溥五代㑹要三十卷王溥冊府元龜一千卷王欽若太平廣記五百卷李昉等總類一千卷李昉等前史精要丁度王氏談録
